<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ORIVIA ADMIN</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071525;
      color: white;
      padding: 25px;
    }
    .container {
      max-width: 500px;
      margin: 50px auto;
      background: #10243a;
      padding: 25px;
      border-radius: 15px;
    }
    h1 { color: #d9b45b; text-align: center; }
    input, textarea, button {
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      box-sizing: border-box;
      border-radius: 7px;
    }
    input, textarea {
      background: #fff;
      border: none;
    }
    button {
      background: #d9b45b;
      color: #071525;
      border: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ORIVIA ADMIN</h1>
    <p>Bienvenue dans votre espace d'administration.</p>
    <input type="text" placeholder="Nom d'utilisateur">
    <input type="password" placeholder="Mot de passe">
    <button onclick="alert('La connexion sera configurée dans la prochaine étape.')">
      Se connecter
    </button>
    <p>ORIVIA SIRÉ — Innover • Construire • Connecter</p>
  </div>
</body>
</html>
